<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Roadster and Beyond</title>
  <meta name="description" content="A fan-made recreation of the Tesla Roadster launch night: the C-wall, the lineup kickflip, the standing flip and the 0-60 run. Keyboard or gamepad." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d10'/%3E%3Cpath d='M3 20l9-6h9l8 3v4H3z' fill='%23e9ebee'/%3E%3Cpath d='M12 14l3-2h6l-1 2z' fill='%23503a28'/%3E%3Ccircle cx='9' cy='22' r='3' fill='%23111'/%3E%3Ccircle cx='24' cy='22' r='3' fill='%23111'/%3E%3C/svg%3E" />
</head>
<body>
  <canvas id="c"></canvas>
  <div id="fatal" style="display:none"></div>
  <script>
    // Show load and runtime errors on the page, so a broken start is never just a blank screen.
    (function () {
      var shown = false;
      function show(msg) {
        if (shown) return; shown = true;
        var el = document.getElementById('fatal');
        el.innerHTML = '<b>Something went wrong starting the game.</b><br>' + String(msg).replace(/</g, '&lt;') + '<br><small>Try a hard refresh (Ctrl/Cmd+Shift+R). If it persists, please share this message.</small>';
        el.style.display = "block";
      }
      window.__fatal = show;
      addEventListener('error', function (e) { show((e.error && e.error.stack) || e.message || 'Script failed to load'); });
      addEventListener('unhandledrejection', function (e) { show(e.reason && (e.reason.stack || e.reason.message) || e.reason); });
      try {
        var c = document.createElement('canvas');
        if (!(c.getContext('webgl2') || c.getContext('webgl'))) show('WebGL is not available in this browser. Enable hardware acceleration and reload.');
      } catch (err) { show(err); }
    })();
  </script>


  <div id="hud" class="hidden">
    <div id="side">
      <div id="t60"><span class="lbl">0 - 60</span><b id="t60v">--</b><small id="t60b"></small></div>
      <div id="score"><span class="lbl">SCORE</span><b id="scorev">0</b></div>
      <div id="stunt"><span class="lbl" id="stuntt"></span><p id="stuntd"></p></div>
    </div>
    <div id="popups"></div>
    <div id="center"></div>
    <div id="hints"></div>
    <div id="toast"></div>
  </div>

  <div id="bhud" class="hidden">
    <div class="grp l"><canvas id="gA" width="300" height="300"></canvas><canvas id="globe" width="300" height="300"></canvas></div>
    <div class="grp r"><canvas id="thr" width="200" height="300"></canvas><canvas id="gB" width="300" height="300"></canvas><canvas id="gC" width="300" height="300"></canvas></div>
  </div>
  <div id="caption"></div>

  <div id="show" class="hidden">
    <div id="showhint">Press <kbd>Esc</kbd> / <kbd>Menu</kbd> to take the wheel</div>
  </div>

  <div id="menu">
    <div class="panel">
      <div class="eyebrow">Fan-made. Not affiliated with Tesla or SpaceX.</div>
      <h1>ROADSTER<br><span>AND BEYOND</span></h1>
      <p class="lede">Launch night at McGregor, rebuilt. Climb the wall and hang upside down, fly off the top, kickflip the lineup, flip from a standstill and chase the 0-60 time.</p>
      <div id="cards"></div>
      <div class="btns"><button id="go">Drive</button><button id="watch">Watch the event</button></div>
      <div id="menuhint"></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
